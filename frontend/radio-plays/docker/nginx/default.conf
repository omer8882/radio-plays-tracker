server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep browser API traffic on the public frontend origin. Docker's DNS
    # resolver is used at request time so recreating the API container does not
    # leave nginx pointing at an obsolete container address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://radio-plays-tracker-api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
